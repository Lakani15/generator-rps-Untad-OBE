<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

:root{
  --bg:#f1f4ef; --surface:#ffffff; --sunken:#e8ede5; --ink:#16211a; --muted:#56655b; --line:#d0d9cf;
  --accent:#1c6a43; --accent-ink:#ffffff; --accent-soft:#dcebe1;
  --warn:#9a5306; --warn-soft:#fbecd3; --bad:#ad2a22; --bad-soft:#f9dedb; --mark:#fff0b8; --mark-ink:#5a4300;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201b; --sunken:#121915; --ink:#e5ece6; --muted:#9aa89e; --line:#2d3830;
  --accent:#62c391; --accent-ink:#0b1a11; --accent-soft:#1d3327;
  --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f08a80; --bad-soft:#3c1b18; --mark:#4a3d0c; --mark-ink:#ffe9a0;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201b; --sunken:#121915; --ink:#e5ece6; --muted:#9aa89e; --line:#2d3830;
  --accent:#62c391; --accent-ink:#0b1a11; --accent-soft:#1d3327;
  --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f08a80; --bad-soft:#3c1b18; --mark:#4a3d0c; --mark-ink:#ffe9a0;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:28px;font-weight:700;letter-spacing:.2px}
h2{font-size:20px;font-weight:600}
h3{font-size:15px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.top .sub{color:var(--muted);font-size:14px}
.hakcipta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;color:var(--muted);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.hakcipta .nama{font-size:12pt}
.hakcipta .lisensi{font-size:12px;max-width:72ch}
.merek{display:flex;align-items:center;gap:14px;min-width:0}
.logo-app{display:block;height:50px;width:auto;flex:none}
.top h1{letter-spacing:.06em;color:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpi>div{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi>div:last-child{border-right:0}
.kpi b{font:600 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi b small{font-size:15px;color:var(--muted);font-weight:500}
.kpi span{font-size:13px;color:var(--muted)}
.duakol{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.duakol>*{min-width:0}
.langkah{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.langkah li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.langkah li:first-child{border-top:0}
.langkah .no{font:500 12px var(--f-data);color:var(--muted)}
.langkah .nm{font-weight:500}
.langkah .ds{font-size:12.5px;color:var(--muted)}
.batang{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px;padding-block:5px}
.batang .trek{height:10px;background:var(--sunken);border-radius:0 5px 5px 0;position:relative;overflow:hidden}
.batang .trek i{position:absolute;left:0;top:0;bottom:0;border-radius:0 5px 5px 0}
.batang .trek i.semua{background:var(--accent-soft)} .batang .trek i.siap{background:var(--accent)}
.batang .nil{font:500 13px var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){ .langkah li{grid-template-columns:22px minmax(0,1fr)} .langkah li .row{grid-column:2} }

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-data);padding:6px 8px;border-radius:4px;background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.chip.contoh{background:var(--mark);color:var(--mark-ink);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
button{font:500 14px/1 var(--f-body);padding:9px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.utama{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.kecil{padding:6px 8px;font-size:13px}
button.bahaya{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tab{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;display:flex;gap:2px}
nav.tab button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:12px 12px 9px;white-space:nowrap;color:var(--muted);display:flex;gap:8px;align-items:center}
nav.tab button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tab .no{font:500 12px var(--f-data)}
nav.tab .tanda{width:8px;height:8px;border-radius:50%;background:var(--line)}
nav.tab .tanda.ok{background:var(--accent)} nav.tab .tanda.warn{background:var(--warn)} nav.tab .tanda.bad{background:var(--bad)}
section.panel{display:flex;flex-direction:column;gap:16px}
.kotak{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kepala{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.ket{color:var(--muted);font-size:13.5px;max-width:72ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.grid .lebar{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f .wajib{color:var(--accent);font:500 11px var(--f-data);margin-left:6px}
input[type=text],input[type=number],select,textarea{font:15px/1.4 var(--f-body);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%;min-width:0}
textarea{resize:vertical;field-sizing:content;min-height:2.6em}
input[type=number]{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.butir{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:8px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.butir:first-of-type{border-top:0}
.butir .kode{font:500 13px var(--f-data);padding-top:9px;color:var(--accent)}
.butir .isi{display:flex;flex-direction:column;gap:8px;min-width:0}
.butir .alat{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cplrow{display:grid;grid-template-columns:90px 110px minmax(0,1fr) auto;gap:8px;align-items:start}
.pilih{display:flex;flex-wrap:wrap;gap:6px}
.pilih label{display:inline-flex;gap:5px;align-items:center;font:500 12.5px var(--f-data);padding:5px 8px;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.pilih label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.jumlah{font:500 13px var(--f-data);font-variant-numeric:tabular-nums}
.gulir{overflow-x:auto;min-width:0}
table.mat{border-collapse:collapse;font:13px var(--f-data);font-variant-numeric:tabular-nums;min-width:560px;width:100%}
table.mat th,table.mat td{border:1px solid var(--line);padding:5px 8px;text-align:center}
table.mat th{background:var(--sunken);font-weight:500}
table.mat td.kiri,table.mat th.kiri{text-align:left}
.pesan{padding:10px 12px;border-radius:4px;font-size:14px;background:var(--sunken);border:1px solid var(--line)}
.pesan.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pesan.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pesan.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
ul.cek{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
ul.cek li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
ul.cek .t{font:600 13px var(--f-data)}
ul.cek .bad .t{color:var(--bad)} ul.cek .warn .t{color:var(--warn)} ul.cek .ok .t{color:var(--accent)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.doc .sampul{text-align:center;display:flex;flex-direction:column;gap:6px;padding-block:8px 16px;border-bottom:1px dashed var(--line)}
.doc .sampul .mk{font:700 22px var(--f-display);text-transform:uppercase}
.doc table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.4}
.doc td,.doc th{border:1px solid var(--muted);padding:5px 7px;vertical-align:top;text-align:left}
.doc th{background:var(--sunken);font-weight:600}
.doc td.t,.doc th.t{text-align:center}
.doc .lbl{font-weight:600;width:150px}
.doc .kd{white-space:nowrap;font-family:var(--f-data);font-size:12px}
.doc .min{min-width:980px}
.doc p+p{margin-top:4px}
.gen{display:flex;flex-direction:column;gap:10px}
.proses{font:13px var(--f-data);color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:20px;max-width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;gap:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);font-size:14px;max-width:calc(100vw - 32px);z-index:20}
table.arsip{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
table.arsip th,table.arsip td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}
table.arsip th{font:500 12px var(--f-data);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
@media (max-width:640px){
  .logo-app{height:42px} .top h1{font-size:21px} .kpi>div{border-right:0;border-bottom:1px solid var(--line)}
  .butir{grid-template-columns:minmax(0,1fr)} .butir .kode{padding-top:0} .butir .alat{justify-content:flex-start}
  .cplrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .cplrow textarea{grid-column:1/-1}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){ button{transition:border-color .12s} }
</style>
